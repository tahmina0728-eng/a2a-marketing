<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    background: #fff;
    color: #1a1a1a;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .logo svg { flex-shrink: 0; }
  .desc {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
  }
  label {
    font-size: 11px;
    font-weight: 600;
    color: #444;
    display: block;
    margin-bottom: 4px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    color: #1a1a1a;
    outline: none;
  }
  input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.15); }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #7c3aed, #6366f1);
    color: white;
    transition: opacity .15s;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status {
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    display: none;
  }
  .status.success { background: #e6f5ee; color: #1c7c4a; display: block; }
  .status.error   { background: #fdecea; color: #c0392b; display: block; }
  .status.loading { background: #ebf3ff; color: #1a6fe8; display: block; }
</style>
</head>
<body>

<div class="logo">
  <svg width="22" height="22" viewBox="0 0 38 57" fill="none">
    <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1ABCFE"/>
    <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 0 1-19 0z" fill="#0ACF83"/>
    <path d="M19 0v19h9.5a9.5 9.5 0 0 0 0-19H19z" fill="#FF7262"/>
    <path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z" fill="#F24E1E"/>
    <path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z" fill="#FF7262"/>
  </svg>
  A2A Campaign Import
</div>

<p class="desc">
  Imports the latest generated image from your A2A platform directly onto the canvas as an editable frame.
</p>

<div>
  <label>Harness URL</label>
  <input id="url" type="text" value="http://localhost:8000" placeholder="http://localhost:8000" />
</div>

<button id="btn">Import Latest Image</button>

<div class="status" id="status"></div>

<script>
  const btn    = document.getElementById("btn");
  const urlIn  = document.getElementById("url");
  const status = document.getElementById("status");

  function setStatus(type, msg) {
    status.className = "status " + type;
    status.textContent = msg;
  }

  btn.addEventListener("click", async () => {
    const base = urlIn.value.trim().replace(/\/$/, "");
    btn.disabled = true;
    setStatus("loading", "Fetching latest image from harness…");

    try {
      const res = await fetch(`${base}/figma/latest`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: "No image prepared yet. Generate one first in A2A." }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      setStatus("loading", `Placing "${data.campaign_name}" on canvas…`);

      parent.postMessage({
        pluginMessage: {
          type: "import-image",
          image_b64: data.image_b64,
          campaign_name: data.campaign_name,
        }
      }, "*");
    } catch (err) {
      btn.disabled = false;
      setStatus("error", err.message);
    }
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "done") {
      btn.disabled = false;
      setStatus("success", `✓ "${msg.name}" placed on canvas`);
    }
    if (msg.type === "error") {
      btn.disabled = false;
      setStatus("error", msg.message);
    }
  };
</script>
</body>
</html>
