steps:
  # Pull previous image to use as layer cache (fails silently on first run)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/campaignos-harness:latest || true']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=gcr.io/$PROJECT_ID/campaignos-harness:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/campaignos-harness:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/campaignos-harness:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'campaignos-harness'
      - '--image=gcr.io/$PROJECT_ID/campaignos-harness:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--concurrency=10'
      - >-
        --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,
        GOOGLE_CLOUD_LOCATION=global,
        GOOGLE_GENAI_USE_VERTEXAI=TRUE,
        GCS_BUCKET=dauntless-karma-497108-b0-campaignos,
        BRAND_ASSETS_MODE=gcs,
        SEARCH_MODE=live,
        SEARCH_ENGINE_ID=campaignos-briefing-search,
        SEARCH_LOCATION=global,
        GEMINI_MODEL_REASONING=gemini-3.5-flash,
        CREATIVE_MODEL=gemini-3.5-flash,
        FALLBACK_CREATIVE_MODEL=gemini-2.0-flash,
        GEMINI_MODEL_IMAGE=gemini-3-pro-image,
        GEMINI_MODEL_IMAGE_ADAPTER=gemini-3-pro-image,
        FALLBACK_IMAGE_MODEL=gemini-2.0-flash-exp,
        VEO_MODEL=veo-3.1-generate-001,
        REEL_ENABLED=true,
        USE_GEMINI_EMBEDDINGS=true,
        GEMINI_EMBEDDING_MODEL=gemini-embedding-2,
        PGVECTOR_HOST=/cloudsql/dauntless-karma-497108-b0:us-central1:campaignos-pgvector,
        PGVECTOR_PORT=5432,
        PGVECTOR_USER=campaignos,
        PGVECTOR_DB=marketing,
        PGVECTOR_PASSWORD=campaignos123,
        BQ_DATASET=briefing_agent,
        BQ_OUTPUT_DATASET=campaign_outputs,
        BQ_LOGGING_ENABLED=true,
        ENVIRONMENT=production,
        LOG_LEVEL=INFO,
        HARNESS_URL=https://campaignos-harness-958438970145.us-central1.run.app,
        EMAIL_SMTP_HOST=smtp.gmail.com,
        EMAIL_SMTP_PORT=587,
        EMAIL_FROM_NAME=CampaignOS,
        INSTAGRAM_BUSINESS_ACCOUNT_ID=17841415786098555,
        META_APP_ID=2002436330660173
      - '--set-secrets=GROQ_API_KEY=GROQ_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_EMBEDDING_KEY:latest,EMAIL_APP_PASSWORD=EMAIL_APP_PASSWORD:latest,EMAIL_FROM=EMAIL_FROM:latest,INSTAGRAM_ACCESS_TOKEN=INSTAGRAM_ACCESS_TOKEN:latest,MAILCHIMP_API_KEY=MAILCHIMP_API_KEY:latest'
      - '--add-cloudsql-instances=dauntless-karma-497108-b0:us-central1:campaignos-pgvector'
      - '--service-account=958438970145-compute@developer.gserviceaccount.com'

images:
  - 'gcr.io/$PROJECT_ID/campaignos-harness:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
