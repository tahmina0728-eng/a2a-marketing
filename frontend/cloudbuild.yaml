steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/campaignos-frontend:latest'
      - '--build-arg'
      - 'VITE_API_URL=${_HARNESS_URL}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/campaignos-frontend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'campaignos-frontend'
      - '--image=gcr.io/$PROJECT_ID/campaignos-frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'

images:
  - 'gcr.io/$PROJECT_ID/campaignos-frontend:latest'

substitutions:
  _HARNESS_URL: 'https://campaignos-harness-xxxx-uc.a.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
